<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน | รับสมัครนักศึกษา </title>
    <link rel="stylesheet" href="Css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="navbar">
        <div class="logo">
            <div class="logo-img">
                <img src="image/Logo-K.svg" alt="Logo KMUTNB">
            </div>

            <span class="logo-text">
                    มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ
                    <br><span>KING MONGKUT'S UNIVERSITY OF TECHNOLOGY NORTH BANGKOK</span>
            </span>
        </div>

        <!-- Button ด้านขวา -->
        <nav class="nav-reg">
            <a href="Register.html">ลงทะเบียน</a>
            <a href="Login.html">เข้าสู่ระบบ</a>
        </nav>
    </header>

    <!-- แถบเมนูด้านล่าง -->
    <nav class="sub-nav">
        <a href="index.html">หน้าหลัก</a>
        <a href="admission-calendar.html">ปฏิทินการรับสมัคร</a>
        <a href="Register-new.html">สมัครนักศึกษาใหม่</a>
        <a href="regulation.html">ระเบียบรับสมัครนักศึกษาใหม่</a>
    </nav>

    <!-- หน้าลงทะเบียน -->
     <main class="register-wrapper">
        <div class="register-container">
            <div class="register-header">
                <h2 class="register-title">กรอกข้อมูลเพื่อลงทะเบียน</h2>
                <p class="register-subtitle">กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง</p>
            </div>

            <form method="post" class="register-form">
                <div class="form-row">
                    <div class="form-group prefix-group">
                        <label for="prefix">คำนำหน้า</label>
                        <select name="prefix" id="prefix" required>
                            <option value="">เลือกคำนำหน้า</option>
                            <option value="เด็กชาย">เด็กชาย</option>
                            <option value="นาย">นาย</option>
                            <option value="เด็กหญิง">เด็กหญิง</option>
                            <option value="นางสาว">นางสาว</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="firstname">ชื่อ</label>
                        <input type="text" id="firstname" placeholder="ชื่อ" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname">นามสกุล</label>
                        <input type="text"  id="lastname" name="lastname" placeholder="นามสกุล" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="citizen_id">เลขบัตรประชาชน</label>
                        <input type="text" id="citizen_id" name="citizen_id" placeholder="เลขบัตรประชาชน">
                    </div>
                    <div class="form-group">
                        <label for="birthdate">วันเกิด</label>
                        <input type="date" id="birthdate" name="birthdate" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">เบอร์โทรศัพท์</label>
                        <input type="tel" id="phone" name="phone" placeholder="08X-XXX-XXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="email">อีเมล</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>
                </div>

                <!-- ปุ่มกด submit / reset -->
                <div class="form-actions">
                    <button type="reset" class="btn-reset">ล้างข้อมูล</button>
                    <button type="submit" class="btn-submit-reg">ส่งใบสมัคร</button>
                </div>

            </form>
        </div>
     </main>
</body>
</html>
